[package]
name = "embodied-fl"
version = "0.4.0"
edition = "2021"
description = "P2P Federated Learning Platform — plug and play, no central coordinator"
license = "Apache-2.0"
readme = "README.md"
keywords = ["federated-learning", "p2p", "libp2p", "rust", "plug-and-play"]
categories = ["science", "network-programming"]
repository = "https://github.com/dechang64/embodied-fl"

[dependencies]
# gRPC
tonic = { version = "0.13", features = ["tls-native-roots", "transport"] }
prost = "0.13"
tokio = { version = "1", features = ["full"] }

# P2P networking (libp2p)
libp2p = { version = "0.54", features = ["tcp", "noise", "yamux", "mdns", "gossipsub", "identify", "ping", "macros", "tokio"] }

# Web
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Database
rusqlite = { version = "0.32", features = ["bundled"] }

# Vector Search
hnsw = "0.11"
space = "0.17"

# Audit & Crypto
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand = "0.8"
rand_pcg = "0.3"
base64 = "0.22"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Date/Time
chrono = { version = "0.4", features = ["serde"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }

[build-dependencies]
tonic-build = "0.13"

[profile.release]
opt-level = 3
lto = true
strip = true
